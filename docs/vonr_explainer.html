<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoNR Architecture — Interactive Explainer</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f8f7f4;
    --bg3: #f1efe8;
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #888780;
    --border: #e0ded6;
    --border2: #cccbc3;
    --blue: #185fa5;
    --blue-light: #e6f1fb;
    --teal: #0f6e56;
    --teal-light: #e1f5ee;
    --purple: #534ab7;
    --purple-light: #eeedfe;
    --amber: #854f0b;
    --amber-light: #faeeda;
    --green: #3b6d11;
    --green-light: #eaf3de;
    --coral: #993c1d;
    --coral-light: #faece7;
    --gray: #444441;
    --gray-light: #f1efe8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #242422;
      --bg3: #2c2c2a;
      --text: #e8e6de;
      --text2: #a8a69e;
      --text3: #6e6c66;
      --border: #3a3a36;
      --border2: #4a4a44;
      --blue: #85b7eb;
      --blue-light: #0c447c;
      --teal: #5dcaa5;
      --teal-light: #085041;
      --purple: #afa9ec;
      --purple-light: #26215c;
      --amber: #ef9f27;
      --amber-light: #412402;
      --green: #97c459;
      --green-light: #173404;
      --coral: #f0997b;
      --coral-light: #4a1b0c;
      --gray: #b4b2a9;
      --gray-light: #2c2c2a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 24px 16px 48px;
    max-width: 800px;
    margin: 0 auto;
  }
  .page-header {
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .page-header h1 {
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .page-header p {
    font-size: 14px;
    color: var(--text2);
  }
  .step-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .pill {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border2);
    background: var(--bg2);
    color: var(--text2);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s;
    font-family: inherit;
  }
  .pill:hover { border-color: var(--text3); color: var(--text); }
  .pill.active {
    background: var(--blue-light);
    border-color: var(--blue);
    color: var(--blue);
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    background: var(--bg);
  }
  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .badge {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .card-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .card-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .svg-container { width: 100%; overflow: hidden; }
  .svg-container svg { display: block; }
  .legend {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
  .leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .explain {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    font-size: 14px;
    color: var(--text2);
    line-height: 1.7;
    background: var(--bg2);
  }
  .explain strong { color: var(--text); font-weight: 600; }
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
  }
  .nav-btn {
    padding: 9px 22px;
    border-radius: 9px;
    border: 1.5px solid var(--border2);
    background: var(--bg2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    transition: all 0.2s;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--text3); }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .progress { font-size: 12px; color: var(--text3); }

  .th { font-size: 14px; font-weight: 500; fill: var(--text); }
  .ts { font-size: 12px; font-weight: 400; fill: var(--text2); }

  .c-teal-fill   { fill: var(--teal-light);   stroke: var(--teal);   }
  .c-teal-text   { fill: var(--teal); }
  .c-amber-fill  { fill: var(--amber-light);  stroke: var(--amber);  }
  .c-amber-text  { fill: var(--amber); }
  .c-purple-fill { fill: var(--purple-light); stroke: var(--purple); }
  .c-purple-text { fill: var(--purple); }
  .c-green-fill  { fill: var(--green-light);  stroke: var(--green);  }
  .c-green-text  { fill: var(--green); }
  .c-gray-fill   { fill: var(--gray-light);   stroke: var(--border2); }
  .c-gray-text   { fill: var(--text2); }
  .c-coral-fill  { fill: var(--coral-light);  stroke: var(--coral);  }
  .c-coral-text  { fill: var(--coral); }
  .c-blue-fill   { fill: var(--blue-light);   stroke: var(--blue);   }
  .c-blue-text   { fill: var(--blue); }
  .arr-line { stroke: var(--border2); fill: none; }
  .dim-line { stroke: var(--border); fill: none; stroke-width: 0.5; }
</style>
</head>
<body>

<div class="page-header">
  <h1>VoNR — How it works</h1>
  <p>An interactive step-by-step guide to Voice over New Radio. Click any step to jump to it.</p>
</div>

<div class="step-pills" id="pills"></div>

<div class="card">
  <div class="card-header">
    <div class="badge" id="badge"></div>
    <div>
      <div class="card-title" id="ctitle"></div>
      <div class="card-sub" id="csub"></div>
    </div>
  </div>
  <div class="svg-container">
    <svg width="100%" viewBox="0 0 680 230" id="diagram"></svg>
  </div>
  <div class="legend" id="legend"></div>
  <div class="explain" id="explain"></div>
</div>

<div class="nav">
  <button class="nav-btn" id="prevBtn" onclick="go(-1)">&#8592; Previous</button>
  <span class="progress" id="prog"></span>
  <button class="nav-btn" id="nextBtn" onclick="go(1)">Next &#8594;</button>
</div>

<script>
const ARROW = `<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--border2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--teal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--coral)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;

const steps = [
{

<rect x="472" y="20" width="168" height="130" rx="8" class="c-blue-fill" stroke-width="1"/>

<text class="ts" x="300" y="196" text-anchor="middle" dominant-baseline="central" style="fill:var(--text3)">2000s</text>
<text class="ts" x="408" y="196" text-anchor="middle" dominant-baseline="central" style="fill:var(--text3)">2010s</text>
<text class="ts" x="556" y="196" text-anchor="middle" dominant-baseline="central" style="fill:var(--text3)">2020s onwards</text>`
},
{
  label: "Phone + Tower",
  badge: "2", bc: "#e1f5ee", btc: "#0f6e56",
  title: "Your phone connects to a 5G tower",
  sub: "UE (phone) talks to gNB (base station) via radio",
  legend: [{c:"var(--teal-light)",l:"UE — your simulated phone (srsRAN)"},{c:"var(--teal-light)",l:"gNB — 5G base station (srsRAN)"},{c:"var(--gray-light)",l:"ZMQ — simulated radio link"}],
  explain: `Your phone is technically called a <strong>UE (User Equipment)</strong>. It connects wirelessly to a <strong>gNB (base station)</strong> — the antenna tower you see on rooftops. In this project, software called <strong>srsRAN UE</strong> pretends to be a phone, and <strong>srsRAN gNB</strong> pretends to be a tower. They talk over a cable using <strong>ZMQ</strong> instead of real radio waves — this gives us all the protocol realism without the hardware cost.`,
  svg: () => `${ARROW}
<rect x="60" y="55" width="200" height="120" rx="12" class="c-teal-fill" stroke-width="0.5"/>
<text class="th c-teal-text" x="160" y="96" text-anchor="middle" dominant-baseline="central">srsRAN UE</text>

<line x1="260" y1="115" x2="418" y2="115" stroke="var(--border2)" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arr)" marker-start="url(#arr)"/>
<rect x="296" y="96" width="108" height="38" rx="6" style="fill:var(--bg2);stroke:var(--border);stroke-width:0.5"/>
<text class="ts" x="350" y="111" text-anchor="middle" dominant-baseline="central" style="fill:var(--text2)">ZMQ link</text>
<text class="ts" x="350" y="126" text-anchor="middle" dominant-baseline="central" style="fill:var(--text3)">(simulated radio)</text>
<rect x="420" y="55" width="200" height="120" rx="12" class="c-teal-fill" stroke-width="0.5"/>
<text class="th c-teal-text" x="520" y="96" text-anchor="middle" dominant-baseline="central">srsRAN gNB</text>
<text class="ts c-teal-text" x="520" y="116" text-anchor="middle" dominant-baseline="central">5G base station</text>
<text class="ts c-teal-text" x="520" y="136" text-anchor="middle" dominant-baseline="central">5G NR — Band n3</text>
<text class="ts c-teal-text" x="520" y="156" text-anchor="middle" dominant-baseline="central">IP: 172.22.0.37</text>
<text class="ts" x="160" y="200" text-anchor="middle" dominant-baseline="central" style="fill:var(--text3)">Real world: your smartphone</text>
<text class="ts" x="520" y="200" text-anchor="middle" dominant-baseline="central" style="fill:var(--text3)">Real world: antenna tower</text>`
},
{
  label: "5G Core",
  badge: "3", bc: "#faeeda", btc: "#854f0b",
  title: "The 5G Core — network headquarters",
  sub: "Verifies your identity and sets up your data connection",
  legend: [{c:"var(--amber-light)",l:"AMF — access manager"},{c:"var(--amber-light)",l:"SMF/UPF — session and data routing"},{c:"var(--gray-light)",l:"AUSF/UDM/NRF — auth, database, directory"}],
  explain: `Once your phone connects to the tower, the tower connects to the <strong>5G Core (5GC)</strong>. Think of the 5GC as the carrier's headquarters. The <strong>AMF</strong> (like a receptionist) registers your phone. The <strong>SMF</strong> (like a desk manager) gives you a data connection and an IP address. The <strong>UPF</strong> (like a mail room) routes your data packets. The <strong>AUSF and UDM</strong> (security + HR database) verify your identity. All of these run as Docker containers using <strong>Open5GS</strong>.`,
  svg: () => `${ARROW}
<rect x="30" y="20" width="620" height="196" rx="14" style="fill:none;stroke:var(--border);stroke-width:1;stroke-dasharray:5 4"/>
<text class="ts" x="48" y="38" dominant-baseline="central" style="fill:var(--text3)">Open5GS 5G Core (SA)</text>
<rect x="50" y="50" width="124" height="64" rx="8" class="c-amber-fill" stroke-width="0.5"/>
<text class="th c-amber-text" x="112" y="75" text-anchor="middle" dominant-baseline="central">AMF</text>
<text class="ts c-amber-text" x="112" y="95" text-anchor="middle" dominant-baseline="central">Who are you?</text>

<text class="ts c-amber-text" x="256" y="95" text-anchor="middle" dominant-baseline="central">Assign IP address</text>
<rect x="338" y="50" width="124" height="64" rx="8" class="c-amber-fill" stroke-width="0.5"/>
<text class="th c-amber-text" x="400" y="75" text-anchor="middle" dominant-baseline="central">UPF</text>
<text class="ts c-amber-text" x="400" y="95" text-anchor="middle" dominant-baseline="central">Route data packets</text>
<rect x="482" y="50" width="140" height="64" rx="8" class="c-amber-fill" stroke-width="0.5"/>
<text class="th c-amber-text" x="552" y="75" text-anchor="middle" dominant-baseline="central">NRF / PCF</text>
<text class="ts c-amber-text" x="552" y="95" text-anchor="middle" dominant-baseline="central">Directory + rules</text>
<rect x="50" y="134" width="124" height="60" rx="8" class="c-gray-fill" stroke-width="0.5"/>
<text class="th c-gray-text" x="112" y="158" text-anchor="middle" dominant-baseline="central">AUSF</text>
<text class="ts c-gray-text" x="112" y="176" text-anchor="middle" dominant-baseline="central">Verify password</text>
<rect x="194" y="134" width="124" height="60" rx="8" class="c-gray-fill" stroke-width="0.5"/>
<text class="th c-gray-text" x="256" y="158" text-anchor="middle" dominant-baseline="central">UDM / UDR</text>
<text class="ts c-gray-text" x="256" y="176" text-anchor="middle" dominant-baseline="central">Your account data</text>
<rect x="338" y="134" width="124" height="60" rx="8" class="c-gray-fill" stroke-width="0.5"/>

<text class="ts c-gray-text" x="400" y="176" text-anchor="middle" dominant-baseline="central">Binding + slicing</text>
<rect x="482" y="134" width="140" height="60" rx="8" class="c-gray-fill" stroke-width="0.5"/>
<text class="th c-gray-text" x="552" y="158" text-anchor="middle" dominant-baseline="central">MongoDB</text>
<text class="ts c-gray-text" x="552" y="176" text-anchor="middle" dominant-baseline="central">Subscriber database</text>`
},
{
  label: "IMS",
  badge: "4", bc: "#eeedfe", btc: "#534ab7",
  title: "IMS — the voice call engine",
  sub: "Three servers work together to handle your call",
  legend: [{c:"var(--purple-light)",l:"P-CSCF — front door your phone knocks"},{c:"var(--purple-light)",l:"I-CSCF — operator who finds your room"},{c:"var(--purple-light)",l:"S-CSCF — your personal call manager"}],
  explain: `<strong>IMS (IP Multimedia Subsystem)</strong> is the system that makes voice calls possible over the internet. It uses the <strong>SIP protocol</strong> (Session Initiation Protocol) — think of SIP as the "dialing" part of a call. Three servers handle this: <strong>P-CSCF</strong> is the front door your phone registers with. <strong>I-CSCF</strong> looks up which server handles your account. <strong>S-CSCF</strong> authenticates you and routes your calls. All three run on <strong>Kamailio</strong> software. Below them is <strong>pyHSS</strong> — the subscriber database that stores your phone number and credentials.`,
  svg: () => `${ARROW}
<rect x="40" y="40" width="160" height="70" rx="10" class="c-teal-fill" stroke-width="0.5"/>

<line x1="520" y1="75" x2="546" y2="75" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#arr-teal)"/>

<text class="th c-coral-text" x="450" y="166" text-anchor="middle" dominant-baseline="central">pyHSS</text>
<text class="ts c-coral-text" x="450" y="184" text-anchor="middle" dominant-baseline="central">IMS subscriber database</text>

},
{
  label: "SIP Register",
  badge: "5", bc: "#eaf3de", btc: "#3b6d11",
  title: "Step 1 of a call: SIP Registration",

let cur = 0;

function render() {
  const s = steps[cur];
  const badge = document.getElementById('badge');
  badge.style.background = s.bc;
  badge.style.color = s.btc;
  badge.textContent = s.badge;
  document.getElementById('ctitle').textContent = s.title;
  document.getElementById('csub').textContent = s.sub;
  document.getElementById('diagram').innerHTML = s.svg();
  document.getElementById('explain').innerHTML = s.explain;
  const leg = document.getElementById('legend');
  leg.innerHTML = s.legend.map(l =>
    `<div class="leg-item"><div class="leg-dot" style="background:${l.c};border:1px solid var(--border)"></div><span>${l.l}</span></div>`
  ).join('');
  document.getElementById('prog').textContent = `${cur + 1} of ${steps.length}`;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').disabled = cur === steps.length - 1;
  document.querySelectorAll('.pill').forEach((b, i) => b.classList.toggle('active', i === cur));
}

function go(d) { cur = Math.max(0, Math.min(steps.length - 1, cur + d)); render(); }

const pills = document.getElementById('pills');
steps.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'pill';
  b.textContent = s.label;
  b.onclick = () => { cur = i; render(); };
  pills.appendChild(b);
});

render();
</script>
